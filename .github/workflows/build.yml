name: Build android package

# The carrier builds here because the user has no build machine. This produces
# the APK; the aarch64 engine libraries inside it are downloaded from the
# engine repository's "Android build" workflow by scripts/fetch-engine-libs.sh.

on:
  push:
    branches: ["arena/**", android-fixes]
  pull_request:
    branches: ["arena/**", android-fixes]
  workflow_dispatch:
    inputs:
      engine_run_id:
        description: "Engine 'Android build' run to pull libraries from (blank = latest green)"
        type: string
        required: false
      skip_libraries:
        description: "Build without engine libraries (smoke-test the Java build only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: carrier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ENGINE_RUN_ID: ${{ inputs.engine_run_id }}
      SKIP_LIBRARIES: ${{ inputs.skip_libraries && '1' || '0' }}
      DEPLOY_BRANCH: srceng-l4d1
      # Not used to reach the engine repository -- that one is public and the
      # artifact download is anonymous. This only lifts the api.github.com rate
      # limit from 60/h to 5000/h.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Host toolchain
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          openjdk-8-jdk ant unzip zip python3
        echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >>"$GITHUB_ENV"

    - name: Android SDK
      run: ANDROID_HOME="$HOME/android-sdk" scripts/setup-android-sdk.sh

    - name: Build
      run: |
        set -euo pipefail
        java -version 2>&1 | head -2
        ant -version
        COMMIT="$(git rev-parse HEAD)" scripts/workflow.sh 2>&1 | tee build.log

    # The APK is only a carrier if the modules are actually inside it, under the
    # ABI directory that becomes APP_LIB_PATH. Check it here rather than
    # discovering it on a phone we cannot read logcat from.
    - name: Inspect the APK
      run: |
        set -uo pipefail
        APK=bin/srceng-debug.apk
        [ -f "$APK" ] || { echo "::error::ant produced no APK"; exit 1; }
        echo "### APK" >>"$GITHUB_STEP_SUMMARY"
        echo >>"$GITHUB_STEP_SUMMARY"
        echo "\`$(basename "$APK")\`, $(wc -c <"$APK" | tr -d ' ') bytes" >>"$GITHUB_STEP_SUMMARY"
        echo >>"$GITHUB_STEP_SUMMARY"
        echo "| entry | size |" >>"$GITHUB_STEP_SUMMARY"
        echo "| --- | --- |" >>"$GITHUB_STEP_SUMMARY"
        unzip -l "$APK" \
          | awk '/lib\// {printf "| %s | %s |\n", $4, $1}' \
          | sed 's/| \([0-9]*\) |/| \1 bytes |/' >>"$GITHUB_STEP_SUMMARY" || true
        echo >>"$GITHUB_STEP_SUMMARY"
        echo "--- native libraries in the APK ---"
        unzip -l "$APK" | grep -a 'lib/' || echo "(none)"
        found=0
        for m in libclient.so libserver.so liblauncher.so; do
          if unzip -l "$APK" | grep -aq "lib/arm64-v8a/${m}"; then
            echo "ok      lib/arm64-v8a/${m}"
            found=$((found + 1))
          else
            echo "::error::${m} is not in lib/arm64-v8a/ - the engine will not find it"
          fi
        done
        # An APK without the engine is not a carrier, and a green run that
        # quietly ships one is worse than a red run. Only the explicit
        # smoke-test mode is allowed to produce a libless APK.
        if [ "${SKIP_LIBRARIES:-0}" != "1" ] && [ "$found" -ne 3 ]; then
          echo "::error::only ${found}/3 required engine modules are in the APK"
          exit 1
        fi
        # libGameUI.so is the VGUI menu, a separate waf target the engine does
        # not currently build. Notice, not warning: it may never be needed.
        if unzip -l "$APK" | grep -aq "lib/arm64-v8a/libGameUI.so"; then
          echo "ok      lib/arm64-v8a/libGameUI.so (optional)"
        else
          echo "::notice::libGameUI.so absent - optional, the Android launcher may not need the VGUI menu"
        fi
        echo "modules_present=${found}" >>"$GITHUB_OUTPUT"
        echo "required modules present: ${found}/3"

    # A module that needs a library nobody shipped is a black screen on the
    # phone and a one-line warning here. Check it before the user installs.
    - name: Check module dependencies
      run: scripts/check-module-deps.sh bin/srceng-debug.apk

    # Where does libSDL2.so come from? Investigation, not plumbing.
    - name: Inspect the engine APK
      run: scripts/inspect-engine-apk.sh

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: srceng-l4d1-debug-apk
        path: bin/srceng-debug.apk
        if-no-files-found: error
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: carrier-build-log
        path: build.log
        if-no-files-found: warn
        retention-days: 14
